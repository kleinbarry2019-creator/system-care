name: minisauras (not enabled)

on: [push]

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: minisauras
        uses: TeamTigers/minisauras@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          directory: './'

# Not placed under .github/workflows: minifying the entire root can damage
# C#, PowerShell, YAML and project files.
